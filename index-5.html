<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0057B8">
<title>Azul Plin · Loja</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--azul:#0057B8;--azul2:#0078E7;--verde:#00A651;--verde2:#00C060;--gold:#F4C430;--laranja:#e8650a;--cream:#f0f5fb;--branco:#fff;--texto:#0d1f35;--texto2:#3a5a7a;--borda:#cce0f5;--cinza:#f0f4f8;--cinza2:#d0dce8;--sombra:0 4px 20px rgba(0,87,184,.12);--font:'Exo 2',sans-serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--cream);color:var(--texto);min-height:100dvh;max-width:480px;margin:0 auto;padding-bottom:80px}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:200px;background:linear-gradient(160deg,var(--azul),var(--azul2));z-index:0;pointer-events:none}

/* NAV BAR */
.nav-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:200;background:#fff;border-top:2px solid var(--borda);display:flex;align-items:center;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom))}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;flex:1;padding:4px 0}
.nav-icon{font-size:20px}.nav-label{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--texto2)}
.nav-item.active .nav-label{color:var(--azul)}
.nav-divider{width:1px;height:30px;background:var(--borda)}

/* HEADER */
.hdr{position:sticky;top:0;z-index:50;background:var(--azul);overflow:visible}
.logo-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-gota{width:34px;height:42px;flex-shrink:0}
.logo-gota svg{width:100%;height:100%}
.logo-text{line-height:1}
.logo-azul{font-size:15px;font-weight:900;color:#fff;letter-spacing:.08em}
.logo-plin{font-size:15px;font-weight:900;color:var(--verde2);letter-spacing:.08em;margin-top:-2px}
.logo-sol{font-size:9px;color:rgba(255,255,255,.5);letter-spacing:.18em;margin-top:1px}
.visitors{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:5px 11px;display:flex;align-items:center;gap:6px}
.v-dot{width:7px;height:7px;border-radius:50%;background:var(--verde2);box-shadow:0 0 6px var(--verde2);animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.v-num{font-family:var(--mono);font-size:12px;color:#fff;font-weight:500}
.v-lbl{font-size:9px;color:rgba(255,255,255,.55)}

/* ABAS LOJA */
.loja-tabs{display:flex;background:rgba(0,0,0,.18);border-bottom:1px solid rgba(255,255,255,.1)}
.loja-tab{flex:1;padding:10px 6px;text-align:center;font-size:12px;font-weight:700;color:rgba(255,255,255,.55);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
.loja-tab.on{color:#fff;border-bottom-color:var(--verde2)}

.search-bar{padding:8px 14px 7px;background:var(--azul)}
.search-inner{position:relative}
.search-inner input{width:100%;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.18);border-radius:11px;padding:9px 14px 9px 36px;color:#fff;font-family:var(--font);font-size:14px;outline:none}
.search-inner input::placeholder{color:rgba(255,255,255,.4)}
.search-inner input:focus{background:rgba(255,255,255,.2);border-color:var(--verde2)}
.si{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:rgba(255,255,255,.4);pointer-events:none}
.filters{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 28px;scrollbar-width:none;background:var(--azul)}
.filters::-webkit-scrollbar{display:none}
.fchip{flex-shrink:0;background:rgba(255,255,255,.11);border:1.5px solid rgba(255,255,255,.14);border-radius:99px;padding:5px 13px;color:rgba(255,255,255,.65);font-family:var(--font);font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s}
.fchip.on{background:#fff;border-color:#fff;color:var(--azul)}

.promo-strip{margin:10px 14px 0;background:linear-gradient(135deg,#fff7e0,#ffe8a0);border:2px solid var(--gold);border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.promo-strip:active{transform:scale(.98)}
.ps-left{display:flex;align-items:center;gap:9px}
.ps-fire{font-size:20px;animation:shake .6s ease-in-out infinite alternate}
@keyframes shake{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.ps-title{font-size:14px;font-weight:900;color:#7a5200}
.ps-sub{font-size:10px;color:#9a7020}
.ps-arrow{width:24px;height:24px;background:var(--azul);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}

.distrib-info{margin:10px 14px 0;background:#e8f2ff;border:2px solid var(--borda);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;display:none}
.distrib-info.show{display:flex}
.di-ico{font-size:22px;flex-shrink:0}
.di-txt{font-size:12px;font-weight:700;color:var(--azul)}
.di-sub{font-size:10px;color:var(--texto2);margin-top:2px}

.lista{padding:10px 14px 20px;position:relative;z-index:1}
.cat-sep{display:flex;align-items:center;gap:10px;padding:14px 2px 7px}
.cat-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--texto2);white-space:nowrap}
.cat-linha{flex:1;height:2px;background:linear-gradient(90deg,var(--borda),transparent);border-radius:99px}

.pcard{background:#fff;border:2px solid var(--borda);border-radius:18px;margin-bottom:11px;overflow:hidden;box-shadow:var(--sombra);transition:border-color .2s}
.pcard.in-cart{border-color:var(--azul2)}
.pcard.prom{border-color:var(--gold)}
.pcard.distrib{border-color:#b0d4f5}
.pcard-img-wrap{width:100%;height:155px;background:linear-gradient(145deg,#edf4ff,#d8ebff);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pcard-img{width:100%;height:100%;object-fit:contain;padding:12px;transition:transform .3s}
.pcard:active .pcard-img{transform:scale(1.04)}
.prom-badge{position:absolute;top:9px;left:9px;background:linear-gradient(135deg,var(--gold),#c8960a);color:#fff;font-size:10px;font-weight:900;padding:3px 9px;border-radius:7px}
.prom-pct{position:absolute;top:9px;right:9px;background:var(--verde);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px}

.pcard-body{padding:11px 13px 8px}
.pcard-name{font-size:14px;font-weight:800;color:var(--texto);margin-bottom:3px;line-height:1.3}
.pcard-desc{font-size:12px;color:var(--texto2);line-height:1.5;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard-desc.exp{-webkit-line-clamp:unset}
.btn-mais{background:none;border:none;color:var(--azul2);font-size:11px;font-weight:800;cursor:pointer;padding:0;font-family:var(--font)}
.pcard-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag-emb{background:#e8f2ff;color:var(--azul);font-size:10px;font-weight:800;padding:2px 8px;border-radius:5px;border:1px solid var(--borda)}
.tag-cod{font-family:var(--mono);font-size:9px;color:#a0b8cc}


.pcard-price{display:flex;align-items:center;justify-content:space-between;padding:9px 13px 11px;border-top:2px solid var(--cinza)}
.price-val{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--azul);white-space:nowrap;letter-spacing:0;line-height:1}
.btn-add{background:linear-gradient(135deg,var(--azul),var(--azul2));border:none;border-radius:11px;padding:9px 17px;color:#fff;font-family:var(--font);font-size:13px;font-weight:800;cursor:pointer;transition:all .16s}
.btn-add:active{transform:scale(.92)}.btn-add.ok{background:linear-gradient(135deg,var(--verde),var(--verde2))}
.qty-strip{display:flex;align-items:center;justify-content:space-between;padding:7px 13px 11px;background:#f0f6ff;border-top:1px solid var(--borda)}
.qty-btns{display:flex;align-items:center;gap:11px}
.qbtn{width:30px;height:30px;background:#fff;border:2px solid var(--borda);border-radius:9px;font-size:17px;font-weight:700;color:var(--azul);cursor:pointer;display:flex;align-items:center;justify-content:center}
.qbtn:active{background:var(--azul);color:#fff;border-color:var(--azul)}
.qnum{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--azul);min-width:20px;text-align:center}
.qty-sub{font-size:12px;color:var(--texto2);text-align:right}
.qty-sub strong{display:block;font-family:var(--mono);font-size:14px;color:var(--azul);font-weight:600}

.fab{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(120px);z-index:100;background:linear-gradient(135deg,var(--azul),var(--azul2));border:none;border-radius:99px;padding:13px 24px;color:#fff;font-family:var(--font);font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:9px;box-shadow:0 6px 24px rgba(0,87,184,.4);transition:all .32s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
.fab.vis{transform:translateX(-50%) translateY(0)}.fab:active{transform:translateX(-50%) scale(.93)}
.fab-badge{background:var(--verde2);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;min-width:22px;text-align:center}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,15,40,.65);z-index:300;backdrop-filter:blur(8px);align-items:flex-end}
.overlay.open{display:flex;animation:fadeB .2s ease}
@keyframes fadeB{from{opacity:0}to{opacity:1}}
.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-height:92dvh;display:flex;flex-direction:column;animation:upSlide .3s cubic-bezier(.34,1.2,.64,1)}
@keyframes upSlide{from{transform:translateY(100%)}to{transform:translateY(0)}}
.s-handle{padding:11px 0 0}.s-handle-bar{width:38px;height:4px;background:var(--cinza2);border-radius:99px;margin:0 auto}
.s-head{display:flex;align-items:center;justify-content:space-between;padding:13px 17px 11px;border-bottom:2px solid var(--cinza)}
.s-title{font-size:17px;font-weight:900;color:var(--texto)}
.btn-fechar{background:var(--cinza);border:1.5px solid var(--cinza2);border-radius:9px;padding:6px 13px;color:var(--texto2);font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer}
.s-body{overflow-y:auto;flex:1;padding:13px 15px}
.campo-grp{background:var(--cinza);border:2px solid var(--borda);border-radius:13px;padding:13px;margin-bottom:11px}
.campo-tit{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--texto2);margin-bottom:9px}
.campo-inp{width:100%;background:#fff;border:2px solid var(--borda);border-radius:9px;padding:10px 12px;font-family:var(--font);font-size:14px;font-weight:600;color:var(--texto);outline:none;margin-bottom:7px;transition:border-color .2s}
.campo-inp:last-child{margin-bottom:0}.campo-inp:focus{border-color:var(--azul2)}
.campo-inp::placeholder{color:#a0b8cc}
.vsel{width:100%;background:#fff;border:2px solid var(--borda);border-radius:9px;padding:10px 12px;font-family:var(--font);font-size:14px;font-weight:600;color:var(--texto);outline:none;-webkit-appearance:none}
.ci{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1.5px solid var(--cinza)}
.ci-img{width:48px;height:48px;border-radius:9px;object-fit:contain;background:var(--cinza);padding:4px;flex-shrink:0;border:1.5px solid var(--borda)}
.ci-info{flex:1}.ci-name{font-size:13px;font-weight:700;color:var(--texto);line-height:1.3}
.ci-qty{font-size:11px;color:var(--texto2);margin-top:1px}
.ci-tot{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--azul);flex-shrink:0}
.totais{background:linear-gradient(135deg,var(--azul),var(--azul2));border-radius:15px;padding:16px;margin:13px 0 0}
.trow{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
.trow .tl{font-size:12px;color:rgba(255,255,255,.55);font-weight:600}.trow .tv{font-family:var(--mono);font-size:13px;color:#fff}
.trow.grand .tl{font-size:14px;font-weight:800;color:rgba(255,255,255,.9)}.trow.grand .tv{font-size:22px;font-weight:600;color:#fff}
.orc-aviso{background:#fff8e0;border:2px solid var(--gold);border-radius:13px;padding:12px 14px;margin:11px 0 0;display:flex;gap:9px;align-items:flex-start}
.oa-ico{font-size:18px;flex-shrink:0}.oa-txt{font-size:12px;color:#7a5a00;line-height:1.5;font-weight:700}
.oa-sub{font-size:11px;color:#a07820;margin-top:2px}
.s-foot{padding:13px 15px 22px;border-top:2px solid var(--cinza);background:#fff;display:flex;flex-direction:column;gap:7px}
.btn-wa{width:100%;background:#25D366;border:none;border-radius:13px;padding:15px;color:#fff;font-family:var(--font);font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-wa:active{opacity:.88}
.btn-limpar{width:100%;background:transparent;border:2px solid var(--borda);border-radius:11px;padding:10px;color:#a0b8cc;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer}
.success-wrap{display:none;flex-direction:column;align-items:center;justify-content:center;padding:44px 24px;text-align:center;min-height:300px}
.success-wrap.show{display:flex}
.success-ico{font-size:60px;margin-bottom:18px;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.success-title{font-size:24px;font-weight:900;color:var(--azul);margin-bottom:8px}
.success-sub{font-size:13px;color:var(--texto2);line-height:1.7}
.empty{text-align:center;padding:60px 30px;color:#a0b8cc}.empty .ei{font-size:44px;margin-bottom:14px;opacity:.4}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--azul);color:#fff;padding:9px 20px;border-radius:99px;font-size:12px;font-weight:700;z-index:500;opacity:0;transition:all .22s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAIYIqc9ie9yiHmR3wsmzXIPz32Ilk50Ww",
  authDomain: "azul-plin-shop.firebaseapp.com",
  projectId: "azul-plin-shop",
  storageBucket: "azul-plin-shop.firebasestorage.app",
  messagingSenderId: "1066498043732",
  appId: "1:1066498043732:web:3c622747dff78e2799a2c1"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Expor funções globais de Firebase
window.fbGet = async (path) => {
  const snap = await get(ref(db, path));
  return snap.exists() ? snap.val() : null;
};
window.fbSet = async (path, val) => {
  await set(ref(db, path), val);
};
window.fbListen = (path, cb) => {
  onValue(ref(db, path), snap => cb(snap.exists() ? snap.val() : null));
};
window.firebaseReady = true;
window.dispatchEvent(new Event('firebaseReady'));
</script>
</head>
<body>

<div class="hdr">
  <div class="logo-bar">
    <div class="logo-wrap">
      <div class="logo-gota">
        <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0096FF"/><stop offset="100%" style="stop-color:#0057B8"/></linearGradient>
            <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#00C060"/><stop offset="100%" style="stop-color:#0096FF"/></linearGradient>
          </defs>
          <path d="M50 5 C50 5 10 55 10 78 C10 101 28 115 50 115 C72 115 90 101 90 78 C90 55 50 5 50 5Z" fill="url(#g1)"/>
          <path d="M15 82 Q30 68 50 78 Q70 88 85 74 L85 95 Q72 110 50 112 Q28 113 15 98Z" fill="url(#g2)" opacity=".9"/>
          <ellipse cx="35" cy="50" rx="8" ry="14" fill="white" opacity=".22" transform="rotate(-15,35,50)"/>
        </svg>
      </div>
      <div class="logo-text">
        <div class="logo-azul">AZUL</div>
        <div class="logo-plin">PLIN</div>
        <div class="logo-sol">Soluções</div>
      </div>
    </div>
    <div class="visitors">
      <div class="v-dot"></div>
      <div><div class="v-num" id="vCount">1 online</div><div class="v-lbl">agora</div></div>
    </div>
  </div>
  <div class="loja-tabs">
    <div class="loja-tab on" onclick="setAba('felim',this)">🧴 Linha Felim</div>
    <div class="loja-tab" onclick="setAba('distrib',this)">🧹 Distribuidora</div>
  </div>
  <div class="search-bar">
    <div class="search-inner">
      <span class="si">🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar produto..." oninput="renderLista()">
    </div>
  </div>
  <div class="filters" id="filtersBar"></div>
</div>

<div class="promo-strip" id="promoStrip" onclick="togglePromo()">
  <div class="ps-left"><div class="ps-fire">🔥</div><div><div class="ps-title">PROMOÇÕES FELIM</div><div class="ps-sub">Preços especiais selecionados</div></div></div>
  <div class="ps-arrow">›</div>
</div>

<div class="distrib-info" id="distribInfo">
  <div class="di-ico">🏭</div>
  <div><div class="di-txt">Linha Distribuidora Felim</div><div class="di-sub">EPI, descartáveis e limpeza profissional</div></div>
</div>

<div class="lista" id="lista"></div>

<button class="fab" id="fab" onclick="abrirSheet()">🛒 Ver pedido <span class="fab-badge" id="fabBadge">0</span></button>

<div class="overlay" id="overlay" onclick="fOv(event)">
  <div class="sheet">
    <div class="s-handle"><div class="s-handle-bar"></div></div>
    <div class="s-head"><div class="s-title" id="sTitle">🛒 Seu pedido</div><button class="btn-fechar" onclick="fecharSheet()">Fechar</button></div>
    <div class="s-body" id="sBody"></div>
    <div class="s-foot" id="sFoot">
      <button class="btn-wa" onclick="finalizar()">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.890-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Enviar pelo WhatsApp
      </button>
      <button class="btn-limpar" onclick="limpar()">Limpar pedido</button>
    </div>
  </div>
</div>

<nav class="nav-bar">

// Firebase sync — dados compartilhados entre aparelhos
const _cache = {};
function get(k){return _cache[k]||[]}
function geto(k,d={}){return _cache[k]!=null?_cache[k]:d}
async function save(k,v){
  _cache[k]=v;
  localStorage.setItem(k,JSON.stringify(v));
  if(window.firebaseReady)await window.fbSet('azulplin/'+k,v);
}
async function syncFirebase(){
  const keys=['azulplin_vendas','azulplin_vendedoras','azulplin_ciclo','azulplin_globais','azulplin_visitors','azulplin_fotos'];
  for(const k of keys){
    try{
      const val=await window.fbGet('azulplin/'+k);
      if(val!=null){_cache[k]=val;localStorage.setItem(k,JSON.stringify(val));}
      else{const local=localStorage.getItem(k);if(local){_cache[k]=JSON.parse(local);await window.fbSet('azulplin/'+k,_cache[k]);}}
    }catch(e){}
  }
}
// Inicializar cache do localStorage imediatamente
['azulplin_vendas','azulplin_vendedoras','azulplin_ciclo','azulplin_globais','azulplin_visitors','azulplin_fotos'].forEach(k=>{

});
// Sincronizar com Firebase quando estiver pronto

// CÁLCULOS
function calcFelim(p){
  const g=getG();
  const custo=p.prom?p.pb:+(p.pb*(1-g.desconto/100)).toFixed(2);
  const final=p.prom?p.pb:+(custo*(1+g.margem/100)).toFixed(2);
  const com=+(final*g.comissao/100).toFixed(2);
  return{final,com,tipo:'felim'};
}
function calcDistrib(p){
  const g=getG();
  
  const final=+(p.pb*(1+g.margem/100)).toFixed(2);
  const com=+(final*g.comissao/100).toFixed(2);
  return{final,com,tipo:'distrib'};
}

let cart={},abaAtual='felim',filtro='Todos',exps={},soPromo=false;

function setAba(aba,btn){
  abaAtual=aba;
  document.querySelectorAll('.loja-tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  filtro='Todos';soPromo=false;
  document.getElementById('promoStrip').style.display=aba==='felim'?'flex':'none';
  const di=document.getElementById('distribInfo');
  di.className='distrib-info'+(aba==='distrib'?' show':'');
  document.getElementById('searchInput').value='';
  buildFiltros();renderLista();
}

function buildFiltros(){
  const prods=abaAtual==='felim'?PF:PD;
  const cats=['Todos',...new Set(prods.map(p=>p.cat))].sort((a,b)=>a==='Todos'?-1:a.localeCompare(b));
  document.getElementById('filtersBar').innerHTML=cats.map(c=>`<button class="fchip ${c===filtro?'on':''}" onclick="setF('${c}',this)">${c}</button>`).join('');
}

function setF(c,btn){filtro=c;soPromo=false;document.querySelectorAll('.fchip').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderLista()}
function togglePromo(){soPromo=!soPromo;if(soPromo){filtro='Todos';document.querySelectorAll('.fchip').forEach(b=>b.classList.remove('on'));document.querySelector('.fchip').classList.add('on')}renderLista()}

function renderLista(){
  const q=document.getElementById('searchInput').value.trim().toUpperCase();
  const prods=abaAtual==='felim'?PF:PD;
  const isD=abaAtual==='distrib';
  const filtrados=prods.filter(p=>(!q||p.nome.toUpperCase().includes(q)||p.cod.includes(q)||(p.cat||'').toUpperCase().includes(q))&&(filtro==='Todos'||p.cat===filtro)&&(!soPromo||p.prom));
  const el=document.getElementById('lista');
  if(!filtrados.length){el.innerHTML=`<div class="empty"><div class="ei">🔍</div><p>Nenhum produto encontrado.</p></div>`;return}
  const g={};filtrados.forEach(p=>{if(!g[p.cat])g[p.cat]=[];g[p.cat].push(p)});
  let html='';
  Object.keys(g).sort().forEach(cat=>{
    html+=`<div class="cat-sep"><span class="cat-label">${cat}</span><div class="cat-linha"></div></div>`;
    g[cat].forEach(p=>{
      const {final}=isD?calcDistrib(p):calcFelim(p);
      const qty=cart[p.cod]?.qty||0;
      const ic=qty>0;
      const exp=exps[p.cod];
      const gv=getG();
      const imgErr=`data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect fill=%22%23e8f2ff%22 width=%22100%25%22 height=%22100%25%22/><text y=%2250%25%22 x=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2248%22>${isD?'🧹':'🧴'}</text></svg>`;
      html+=`<div class="pcard ${ic?'in-cart':''} ${p.prom?'prom':''} ${isD?'distrib':''}" id="pc-${p.cod}">
        <div class="pcard-img-wrap">
          <img class="pcard-img" src="${p.foto}" onerror="this.src='${imgErr}'" alt="${p.nome}" loading="lazy">
          ${p.prom&&!isD?`<span class="prom-badge">PROMOÇÃO</span><span class="prom-pct">${gv.descProm||10}% OFF</span>`:''}
        </div>
        <div class="pcard-body">
          <div class="pcard-name">${p.nome}</div>
          ${p.desc?`<div class="pcard-desc ${exp?'exp':''}" id="d-${p.cod}">${p.desc}</div><button class="btn-mais" onclick="toggleExp('${p.cod}')">${exp?'↑ menos':'ver mais ↓'}</button>`:''}
          <div class="pcard-meta">
            <span class="tag-emb">${p.emb}</span>
            <span class="tag-cod">${p.cod}</span>
            
          </div>
        </div>
        <div class="pcard-price">
          <div style="font-family:var(--mono);font-size:22px;font-weight:500;color:var(--azul);white-space:nowrap;letter-spacing:0">${fmtBRL(final)}</div>
          <button class="btn-add ${ic?'ok':''}" onclick="addCart('${p.cod}','${isD?'distrib':'felim'}')">${ic?'✓ Adicionado':'+ Adicionar'}</button>
        </div>
        ${ic?`<div class="qty-strip" id="qs-${p.cod}"><div class="qty-btns"><button class="qbtn" onclick="chQ('${p.cod}',-1)">−</button><span class="qnum" id="qn-${p.cod}">${qty}</span><button class="qbtn" onclick="chQ('${p.cod}',1)">+</button></div><div class="qty-sub">Subtotal<strong>${fmtBRL(final*qty)}</strong></div></div>`:''}
      </div>`;
    });
  });
  el.innerHTML=html;
}

function toggleExp(cod){exps[cod]=!exps[cod];renderLista()}
function getProd(cod){return PF.find(x=>x.cod===cod)||PD.find(x=>x.cod===cod)}
function getPreco(p,tipo){return tipo==='distrib'?calcDistrib(p).final:calcFelim(p).final}

function addCart(cod,tipo){
  if(!cart[cod])cart[cod]={qty:0,tipo};
  cart[cod].qty++;updateFab();renderLista();showToast('✓ Adicionado');
}

function chQ(cod,d){
  if(!cart[cod])return;
  cart[cod].qty=Math.max(0,cart[cod].qty+d);
  if(!cart[cod].qty)delete cart[cod];
  updateFab();
  const p=getProd(cod);if(!p)return;
  const{tipo}=cart[cod]||{tipo:'felim'};
  const final=getPreco(p,cart[cod]?.tipo||tipo);
  const qty=cart[cod]?.qty||0;
  const card=document.getElementById(`pc-${cod}`);
  const qs=document.getElementById(`qs-${cod}`);
  const qn=document.getElementById(`qn-${cod}`);
  const ab=card?.querySelector('.btn-add');
  if(!qty){qs?.remove();card?.classList.remove('in-cart');if(ab){ab.textContent='+ Adicionar';ab.classList.remove('ok')}}
  else{if(qn)qn.textContent=qty;if(qs)qs.querySelector('.qty-sub strong').textContent=fmtBRL(final*qty)}
}

function updateFab(){
  const t=Object.values(cart).reduce((s,v)=>s+v.qty,0);
  document.getElementById('fabBadge').textContent=t;
  document.getElementById('fab').className='fab'+(t>0?' vis':'');
}

function abrirSheet(){
  const keys=Object.keys(cart);if(!keys.length){showToast('Carrinho vazio!');return}
  let total=0,html='';
  keys.forEach(cod=>{
    const p=getProd(cod);if(!p)return;
    const{qty,tipo}=cart[cod];
    const final=getPreco(p,tipo);
    const sub=final*qty;total+=sub;
    html+=`<div class="ci"><img class="ci-img" src="${p.foto}" onerror="this.style.display='none'" alt="${p.nome}"><div class="ci-info"><div class="ci-name">${p.nome}</div><div class="ci-qty">${qty}x · ${fmtBRL(final)}${tipo==='distrib'?' 🏭':''}</div></div><div class="ci-tot">${fmtBRL(sub)}</div></div>`;
  });
  const vs=get(K_VENDEDORAS);
  const vSel=vs.length?`<div class="campo-grp"><div class="campo-tit">👤 Vendedor(a)</div><select class="vsel" id="vSel"><option value="">Selecione...</option>${vs.map(v=>`<option value="${v.pin}">${v.nome}</option>`).join('')}</select></div>`:'';
  document.getElementById('sBody').innerHTML=`<div class="campo-grp"><div class="campo-tit">📋 Seus dados</div><input class="campo-inp" id="cNome" type="text" placeholder="Seu nome ou empresa"><input class="campo-inp" id="cTel" type="tel" placeholder="Seu WhatsApp"><input class="campo-inp" id="cEnd" type="text" placeholder="Endereço (opcional)"></div>${vSel}${html}<div class="totais"><div class="trow grand"><span class="tl">Total do orçamento</span><span class="tv">${fmtBRL(total)}</span></div></div><div class="orc-aviso"><div class="oa-ico">ℹ️</div><div><div class="oa-txt">Este é um orçamento</div><div class="oa-sub">Nossa equipe confirma e combina o pagamento.</div></div></div>`;
  document.getElementById('sTitle').textContent='🛒 Seu pedido';
  document.getElementById('sFoot').style.display='';
  document.getElementById('overlay').classList.add('open');
}

function fecharSheet(){document.getElementById('overlay').classList.remove('open')}
function fOv(e){if(e.target===document.getElementById('overlay'))fecharSheet()}

function finalizar(){
  const nome=document.getElementById('cNome')?.value.trim()||'Cliente';
  const tel=(document.getElementById('cTel')?.value.trim()||'').replace(/\D/g,'');
  const end=document.getElementById('cEnd')?.value.trim()||'';
  const vPin=document.getElementById('vSel')?.value||'';
  const keys=Object.keys(cart);if(!keys.length)return;
  const g=getG();
  let total=0,comissao=0;const itens=[];
  let linhas=[`📋 *NOVO ORÇAMENTO — Azul Plin*\n`,`👤 *Cliente:* ${nome}`];
  if(tel)linhas.push(`📱 *WhatsApp:* ${tel}`);
  if(end)linhas.push(`📍 *Endereço:* ${end}`);
  linhas.push('');linhas.push('*PRODUTOS:*');
  keys.forEach(cod=>{
    const p=getProd(cod);if(!p)return;
    const{qty,tipo}=cart[cod];
    const final=getPreco(p,tipo);
    const sub=+(final*qty).toFixed(2);
    const com=+(final*(g.comissao/100)*qty).toFixed(2);
    total+=sub;comissao+=com;
    itens.push({cod,nome:p.nome,emb:p.emb,qty,precoUnit:final,subtotal:sub,comissao:com,tipo});
    linhas.push(`• ${p.nome} (${p.emb}) — ${qty}x — ${fmtBRL(sub)}${tipo==='distrib'?' [Dist.]':''}`);
  });
  linhas.push('');linhas.push(`💰 *TOTAL: ${fmtBRL(total)}*`);
  linhas.push('_Aguardando confirmação de pagamento._');
  linhas.push('_Azul Plin Soluções — CNPJ 39.491.290/0001-59_');
  const vendas=get(K_VENDAS);
  vendas.push({id:Date.now().toString(),data:new Date().toISOString(),cliente:{nome,tel,end},vendedoraPin:vPin,itens,total,comissao,lucro:+(total*0.25).toFixed(2),status:'orcamento'});
  save(K_VENDAS,vendas);
  const msg=encodeURIComponent(linhas.join('\n'));
  window.open(`https://chat.whatsapp.com/${GRUPO_WA}?text=${msg}`,'_blank');
  cart={};updateFab();
  document.getElementById('sFoot').style.display='none';
  document.getElementById('sTitle').textContent='✅ Enviado!';
  document.getElementById('sBody').innerHTML=`<div class="success-wrap show"><div class="success-ico">🎉</div><div class="success-title">Orçamento Enviado!</div><div class="success-sub">Pedido enviado pelo WhatsApp.<br>Nossa equipe entrará em contato!</div></div>`;
  renderLista();setTimeout(fecharSheet,3500);
}

function limpar(){if(!confirm('Limpar pedido?'))return;cart={};updateFab();fecharSheet();renderLista()}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
buildFiltros();renderLista();
</script>
